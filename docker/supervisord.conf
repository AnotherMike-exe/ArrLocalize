[supervisord]
nodaemon=true
user=root
logfile=/config/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/tmp/supervisord.pid

[program:localize]
command=/usr/local/bin/RunLoop.sh
autorestart=true
startsecs=5
redirect_stderr=true
stdout_logfile=/config/supervisord.log
stdout_logfile_maxbytes=0
